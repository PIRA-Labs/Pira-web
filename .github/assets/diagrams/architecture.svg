<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <defs>
    <linearGradient id="trustGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d5af1"/>
      <stop offset="100%" stop-color="#7b61ff"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#102b32"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
    <filter id="thinShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#3d5af1"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="520" fill="#0a0a0c"/>

  <!-- Trust boundary -->
  <rect x="80" y="95" width="1040" height="400" rx="14" fill="none" stroke="#3d5af1" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.45"/>
  <text x="600" y="88" text-anchor="middle" font-family="Space Grotesk, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#3d5af1" letter-spacing="0.6">TRUST BOUNDARY — PIRA RUNTIME</text>

  <!-- Layer 1: AI Agent / Model Provider -->
  <g filter="url(#thinShadow)">
    <rect x="80" y="35" width="300" height="50" rx="8" fill="url(#trustGrad)" opacity="0.12"/>
    <rect x="80" y="35" width="300" height="50" rx="8" fill="none" stroke="#3d5af1" stroke-width="1.5"/>
    <text x="230" y="64" text-anchor="middle" font-family="Space Grotesk, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#ffffff">AI Agent / Model Provider</text>
    <text x="230" y="80" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="11" fill="#9da3b3">Nebius Token Factory</text>
  </g>
  <line x1="380" y1="60" x2="420" y2="60" stroke="#3d5af1" stroke-width="2" marker-end="url(#ah)"/>
  <text x="400" y="54" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#7b61ff" opacity="0.7">untrusted</text>

  <!-- Layer 2: Typed Action Proposal -->
  <g filter="url(#thinShadow)">
    <rect x="420" y="35" width="260" height="50" rx="8" fill="#1a1a2e" fill-opacity="0.8" stroke="#3d5af1" stroke-width="1.5"/>
    <text x="550" y="64" text-anchor="middle" font-family="Space Grotesk, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Typed Action Proposal</text>
    <text x="550" y="80" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="11" fill="#9da3b3">allowlisted · schema-validated</text>
  </g>
  <line x1="680" y1="60" x2="720" y2="60" stroke="#3d5af1" stroke-width="2" marker-end="url(#ah)"/>

  <!-- Layer 3: Policy & Consent -->
  <g filter="url(#thinShadow)">
    <rect x="720" y="35" width="260" height="50" rx="8" fill="#1a1a2e" fill-opacity="0.8" stroke="#3d5af1" stroke-width="1.5"/>
    <text x="850" y="64" text-anchor="middle" font-family="Space Grotesk, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Policy &amp; Consent</text>
    <text x="850" y="80" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="11" fill="#9da3b3">deny-by-default · user-scoped</text>
  </g>
  <line x1="850" y1="85" x2="850" y2="175" stroke="#3d5af1" stroke-width="1.8" stroke-dasharray="3,3" marker-end="url(#ah)"/>
  <text x="855" y="135" font-family="Inter, sans-serif" font-size="10" fill="#7b61ff" opacity="0.7">evaluated</text>

  <!-- Layer 4: Trusted Capability Executor -->
  <g filter="url(#thinShadow)">
    <rect x="80" y="175" width="300" height="60" rx="8" fill="url(#capGrad)" fill-opacity="0.2" stroke="#7b61ff" stroke-width="1.5"/>
    <text x="230" y="204" text-anchor="middle" font-family="Space Grotesk, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Trusted Capability Executor</text>
    <text x="230" y="220" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="11" fill="#9da3b3">revalidates parameters at call site</text>
    <text x="230" y="236" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="11" fill="#9da3b3">Auditor · Emergency Stop</text>
  </g>
  <line x1="380" y1="205" x2="420" y2="205" stroke="#3d5af1" stroke-width="2" marker-end="url(#ah)"/>

  <!-- Layer 5: Android APIs / Sensors / Wearables -->
  <g filter="url(#thinShadow)">
    <rect x="420" y="175" width="760" height="60" rx="8" fill="#1a1a2e" fill-opacity="0.5" stroke="#4a4a6a" stroke-width="1.5"/>
    <text x="800" y="204" text-anchor="middle" font-family="Space Grotesk, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#ffffff">Android APIs / Sensors / Wearables</text>
    <text x="800" y="220" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="11" fill="#9da3b3">Camera · Microphone · GPS · Bluetooth LE · Notifications</text>
    <text x="800" y="236" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="11" fill="#9da3b3">Revocation · Audit trail · Permission-scoped</text>
  </g>

  <!-- Layer 6: Feedback / Observation loop -->
  <line x1="800" y1="235" x2="800" y2="285" stroke="#3d5af1" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#ah)"/>

  <g filter="url(#thinShadow)">
    <rect x="420" y="290" width="760" height="50" rx="8" fill="#1a1a2e" fill-opacity="0.35" stroke="#3d5af1" stroke-width="1.5"/>
    <text x="800" y="314" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="12" fill="#7b61ff" font-weight="600">Observe → Reason → Act → Verify</text>
    <text x="800" y="332" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="11" fill="#9da3b3">Feedback closes the loop. Execution evidence feeds the next reasoning step.</text>
  </g>

  <!-- Layer 7: Audit / Evidence -->
  <g filter="url(#thinShadow)">
    <rect x="80" y="290" width="300" height="50" rx="8" fill="url(#trustGrad)" fill-opacity="0.1" stroke="#4a4a6a" stroke-width="1.2"/>
    <text x="230" y="314" text-anchor="middle" font-family="Space Grotesk, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Auditable Execution</text>
    <text x="230" y="332" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="11" fill="#9da3b3">Tamper-evident log · Revocation · Compliance</text>
  </g>
  <line x1="230" y1="235" x2="230" y2="290" stroke="#7b61ff" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#ah)"/>

  <!-- Threat indicators -->
  <text x="600" y="400" text-anchor="middle" font-family="Space Grotesk, -apple-system, sans-serif" font-size="12" fill="#9da3b3" opacity="0.7">Threat model: prompt injection · confused deputy · replay · parameter tampering · credential leakage · BLE impersonation</text>
  <text x="600" y="420" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="10" fill="#9da3b3" opacity="0.5">Not implemented: StrongBox attestation, cryptographically signed grants, process isolation, hardware-backed guarantees</text>

  <!-- Footer -->
  <text x="600" y="480" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="11" fill="#9da3b3">PIRA — Physical Intelligence Runtime for Agents · Trust makes physical intelligence possible</text>
</svg>
